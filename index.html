
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A One Face Attendance</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: #123b68;
    color: white;
    padding: 20px;
    text-align: center;
}

header h2 {
    margin: 0;
}

header p {
    margin: 7px 0 0;
    font-size: 13px;
    color: #dbeafe;
}

main {
    padding: 20px;
    text-align: center;
}

.camera-box {
    background: #101827;
    border-radius: 18px;
    max-width: 500px;
    height: 380px;
    margin: 25px auto 15px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#cameraMessage {
    color: white;
    position: absolute;
    padding: 15px;
    font-size: 14px;
    pointer-events: none;
}

.status {
    font-size: 14px;
    color: #475569;
    margin-top: 15px;
}

/* Admin icon */

.admin-icon {
    position: fixed;
    bottom: 22px;
    right: 22px;
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: #123b68;
    color: white;
    font-size: 23px;
    cursor: pointer;
    box-shadow: 0 4px 15px #0003;
}

/* Admin login */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #0009;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 350px;
    padding: 25px;
    border-radius: 16px;
    text-align: center;
}

.login-box h3 {
    margin-top: 0;
}

.login-box input {
    width: 100%;
    padding: 13px;
    margin: 12px 0;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
}

.login-box button {
    width: 100%;
    padding: 13px;
    background: #123b68;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
}

.close {
    margin-top: 12px;
    background: #64748b !important;
}

#loginMessage {
    font-size: 12px;
    color: #b45309;
    margin-top: 12px;
}
</style>
</head>

<body>

<header>
    <h2>A ONE DIAGNOSTICS</h2>
    <p>FACE ATTENDANCE SYSTEM</p>
</header>

<main>

    <h3>Attendance Camera</h3>

    <div class="camera-box">
        <video id="camera" autoplay muted playsinline></video>
        <div id="cameraMessage">Starting camera...</div>
    </div>

    <div class="status" id="status">
        Camera is initializing...
    </div>

</main>

<!-- Admin icon -->

<button class="admin-icon"
        onclick="openAdmin()"
        aria-label="Admin login">
    🔒
</button>

<!-- Admin login popup -->

<div class="modal" id="adminModal">

    <div class="login-box">

        <h3>Admin Login</h3>

        <p>Enter administrator password</p>

        <form id="loginForm">
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <div id="loginMessage">
            Secure admin authentication will be connected in the next setup step.
        </div>

        <button class="close" onclick="closeAdmin()">
            Close
        </button>

    </div>
</div>

<script>

// Open camera automatically

async function startCamera() {

    const video = document.getElementById("camera");
    const message = document.getElementById("cameraMessage");
    const status = document.getElementById("status");

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user"
            },
            audio: false
        });

        video.srcObject = stream;

        message.style.display = "none";
        status.textContent = "Camera is ready";

    } catch (error) {

        message.textContent =
            "Camera permission required. Please allow camera access.";

        status.textContent = "Camera unavailable";

    }
}

// Admin popup

function openAdmin() {
    document.getElementById("adminModal").style.display = "flex";
}

function closeAdmin() {
    document.getElementById("adminModal").style.display = "none";
}

// Password authentication will be connected securely
// through Supabase. Never store the real password here.

document.getElementById("loginForm").addEventListener("submit",
    function(event) {

        event.preventDefault();

        document.getElementById("loginMessage").textContent =
            "Admin authentication is not connected yet. Complete the secure backend setup first.";

    }
);

// Start camera

window.addEventListener("load", startCamera);

</script>

</body>
</html>
